# Alembic CLI configuration for LaunchTrace.
#
# The migration environment lives inside the package (src/db/alembic/) so the
# Docker image, which copies only src/, can migrate itself without this file.
# The database URL is deliberately NOT set here: env.py takes it from
# DATABASE_URL via src.settings (absent -> the local SQLite file
# data/local/launchtrace.sqlite).
#
#     alembic upgrade head
#     alembic revision -m "describe the change" --autogenerate
#     python -m src.pipeline init-db      # the same upgrade, plus adoption of a pre-Alembic database

[alembic]
script_location = %(here)s/src/db/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

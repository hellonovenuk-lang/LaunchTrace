name: Weekly pipeline

# The UKIPO publishes the Trade Marks Journal on Fridays. This runs a few hours
# after the usual publication window and retries through the evening, because a
# journal that is not up yet is a normal condition rather than a failure.
#
# Nothing is emailed unless SEND_MODE is 'automatic' AND the run is approved.
# Keep SEND_MODE=review until several weeks of output have been checked by hand.

on:
  schedule:
    # 13:00, 16:00 and 19:00 UTC on Fridays.
    - cron: "0 13 * * 5"
    - cron: "0 16 * * 5"
    - cron: "0 19 * * 5"
  workflow_dispatch:
    inputs:
      journal:
        description: "Journal number (e.g. 2026-036). Leave blank for the latest."
        required: false
      source:
        description: "Journal source. Use 'local' for a journal XML committed to data/journals/, because ipo.gov.uk refuses automated clients."
        required: false
        default: "ukipo_http"
        type: choice
        options: [ukipo_http, local, open_data]
      company_index:
        description: "Build the free Companies House bulk index (~500 MB, ~10 min, cached for the month). Without it there is no company evidence and every record is capped below HIGH."
        type: boolean
        default: true
        required: false
      send:
        description: "Attempt delivery after the run (still blocked in review mode)"
        type: boolean
        default: false
        required: false
      force:
        description: "Process the journal even if it has already been processed (spends search calls again)"
        type: boolean
        default: false
        required: false

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Company evidence is one of the five legs of a meaningful run. Without
      # either this index or a Companies House API key the registry resolves to
      # 'none', nothing matches, and every record is capped below the HIGH
      # band -- a degraded result that reads like a finding about the signal.
      # Companies House refreshes the snapshot monthly, so the key is the month:
      # a new month misses, rebuilds and re-caches; the rest of the month hits.
      - name: Work out the snapshot month
        if: github.event.inputs.company_index != 'false'
        id: stamp
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the Companies House index
        if: github.event.inputs.company_index != 'false'
        id: ch-cache
        uses: actions/cache@v4
        with:
          path: data/companies_house/ch_index.sqlite
          key: ch-index-${{ steps.stamp.outputs.month }}

      - name: Build the Companies House index if this month's is not cached
        if: github.event.inputs.company_index != 'false' && steps.ch-cache.outputs.cache-hit != 'true'
        run: python -m src.pipeline build-company-index --download

      # Without a DATABASE_URL secret the run uses the SQLite file, which a
      # fresh runner would not have: restore the last one so 'already
      # processed', known applicants and the monthly search budget carry over.
      # Secrets cannot be used in 'if:', so test it in a shell step.
      - name: Is a hosted database configured?
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "hosted=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL is not set; using the SQLite file carried between runs in the Actions cache. Set DATABASE_URL (see HUMAN_ACTIONS.md) for durable history."
          fi

      - name: Restore the local SQLite database
        if: steps.db.outputs.hosted != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/local/launchtrace.sqlite
          key: lt-db-${{ github.run_id }}
          restore-keys: lt-db-

      - name: Run the weekly pipeline
        id: pipeline
        env:
          ENVIRONMENT: production
          SEND_MODE: ${{ vars.SEND_MODE || 'review' }}
          SITE_URL: ${{ vars.SITE_URL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          LOG_FORMAT: json
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-4-5-20251001' }}
          SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'none' }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          JOURNAL_SOURCE: ${{ github.event.inputs.source || 'ukipo_http' }}
          # Optional repository variable; blank means config/costs.json decides.
          SEARCH_MAX_CALLS_PER_RUN: ${{ vars.SEARCH_MAX_CALLS_PER_RUN }}
        run: |
          set -o pipefail
          # Say what this run actually has before it runs, so a degraded result
          # is never mistaken for a finding about the signal.
          python -m src.pipeline check-config
          ARGS=""
          if [ -n "${{ github.event.inputs.journal }}" ]; then
            ARGS="--journal ${{ github.event.inputs.journal }}"
          fi
          if [ "${{ github.event.inputs.send }}" = "true" ]; then
            ARGS="$ARGS --send"
          fi
          # Only a person can force a re-run. Scheduled runs never do, so the
          # later Friday attempts stop at 'already processed' at no cost.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python -m src.pipeline weekly $ARGS | tee pipeline.log
        continue-on-error: true

      # The public weekly feed is built from the database, so it runs even when
      # the weekly step exited early on an already-processed journal. It never
      # fails the run. Publishing the artifact (e.g. to GitHub Pages) is a
      # human decision: see docs/PUBLIC_FEED.md.
      - name: Build the public feed
        if: always()
        continue-on-error: true
        env:
          ENVIRONMENT: production
          SITE_URL: ${{ vars.SITE_URL }}
          LOG_FORMAT: json
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.pipeline build-feed --out public/

      - name: Upload the public feed
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: public-feed-${{ github.run_number }}
          path: public/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      # Fold any write-ahead log into the database file so the cache holds all of it.
      - name: Checkpoint the local SQLite database
        if: always() && steps.db.outputs.hosted != 'true'
        run: |
          if [ -f data/local/launchtrace.sqlite ]; then
            python -c "import sqlite3; c = sqlite3.connect('data/local/launchtrace.sqlite'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          fi

      - name: Save the local SQLite database
        if: always() && steps.db.outputs.hosted != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/local/launchtrace.sqlite
          key: lt-db-${{ github.run_id }}

      # Cache entries are evicted after 7 days unused, so keep a copy as an artifact too.
      - name: Back up the local SQLite database
        if: always() && steps.db.outputs.hosted != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: launchtrace-db-${{ github.run_number }}
          path: data/local/launchtrace.sqlite
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the week's report and QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_number }}
          path: |
            reports/runs/**
            pipeline.log
          retention-days: 60
          if-no-files-found: warn

      - name: Fail the job if the run did not complete
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::The weekly pipeline did not complete. Nothing was sent."
          echo "A journal that is not published yet is normal on the first attempt of the day;"
          echo "the later scheduled attempts will retry. Check pipeline.log in the artifacts."
          exit 1

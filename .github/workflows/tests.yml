name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Tests
        run: pytest -q --cov=src --cov-report=term-missing

      - name: Smoke test (whole pipeline on fixture data)
        run: python -m src.pipeline smoke-test

      - name: Verify the PostgreSQL migration applies
        run: |
          python scripts/generate_migration.py > /tmp/generated.sql
          diff -u migrations/0001_initial.sql /tmp/generated.sql \
            || (echo "::error::migrations/0001_initial.sql is out of date. Run: python scripts/generate_migration.py > migrations/0001_initial.sql" && exit 1)

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchtrace
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Apply the schema to a real PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d launchtrace -v ON_ERROR_STOP=1 -f migrations/0001_initial.sql

[project]
name = "launchtrace"
version = "0.1.0"
description = "LaunchTrace Food - weekly sales-intelligence feed of emerging UK packaged food brands from UKIPO trade mark activity."
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "tenacity>=8.2",
  "structlog>=24.1",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "stripe>=9.0",
  "lxml>=5.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "types-requests"]

[project.scripts]
launchtrace = "src.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "reports", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# UP042: the str+Enum bases are deliberate -- they keep enum values JSON- and
# template-friendly across pydantic, SQLAlchemy and Jinja without extra casting.
ignore = ["E501", "B008", "SIM108", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = "(tests/|scripts/)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

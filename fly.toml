# Fly.io deployment for the LaunchTrace website.
#
# First time:
#   fly launch --no-deploy --copy-config
#   fly secrets set DATABASE_URL="..." STRIPE_SECRET_KEY="..." STRIPE_WEBHOOK_SECRET="..." RESEND_API_KEY="..." ADMIN_TOKEN="..."
#   fly deploy
#
# Change 'app' below to the name Fly gives you.

app = "launchtrace"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_FORMAT = "json"
  SEND_MODE = "review"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
